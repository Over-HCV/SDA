# Publica el bundle wasm de learn/ en GitHub Pages.
#
# learn/docs/ no se versiona: app.json cambia entero en cada build (son 3 MB de
# base64) y engordaría el historial sin aportar nada revisable. Se reconstruye
# acá y se sube como artefacto de Pages, así lo publicado siempre sale del
# código que está en main.
#
# Manual:  Actions -> Publicar SDA Lab -> Run workflow

name: Publicar SDA Lab

on:
  push:
    branches: [main]
    paths:
      - "learn/**"
      - "libs/_comun/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si entra otra, la anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # No se restaura renv.lock entero a propósito. El lockfile es único para
      # todo el repo (S3) y trae 111 paquetes: los cuadernos de notes/SDA/, los
      # talleres y hasta unigd/httpgd, que son el dispositivo gráfico del plugin
      # de R de VS Code. unigd necesita libtiffxx.so.6, que el runner no tiene,
      # y la restauración muere ahí sin que la app lo use nunca.
      #
      # Acá se instala solo lo que el bundle necesita. Las versiones que
      # terminan DENTRO del bundle no salen de estas: shinylive baja los
      # binarios wasm de su propio repositorio. Estrictamente bastan shinylive,
      # renv y jsonlite; los demás van para que el aviso de "version mismatch"
      # de shinylive compare contra algo real.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::shiny
            any::bslib
            any::bsicons
            any::DT
            any::ggplot2
            any::commonmark
            any::jsonlite
            any::renv
            any::shinylive

      - name: Construir el bundle wasm
        run: Rscript -e 'source("learn/build.R"); construir_bundle()'

      - name: Comprobar que el bundle no salió vacío
        run: |
          test -f learn/docs/app.json || { echo "falta app.json"; exit 1; }
          tamano=$(wc -c < learn/docs/app.json)
          echo "app.json: $tamano bytes"
          test "$tamano" -gt 100000 || { echo "app.json sospechosamente chico"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: learn/docs

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    # El entorno `github-pages` lo crea GitHub solo, al poner Settings -> Pages
    # -> Source en "GitHub Actions". Hasta entonces el linter del editor lo
    # marca como inexistente: es un falso positivo, no un error del workflow.
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
